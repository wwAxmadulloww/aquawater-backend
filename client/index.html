<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02060e" />
    <meta name="description" content="AquaWater Uzbekistan — toza ichimlik suvini uyingiz va ofisingizga yetkazib beramiz" />
    <!--
      Open Graph. Without these, the site's own link pasted into Telegram —
      which is how this business reaches most of its customers — rendered as
      bare text with no title, image or description.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AquaWater Uzbekistan" />
    <meta property="og:title" content="AquaWater — toza suv uyingizga" />
    <meta property="og:description" content="Toshkent va Uzbekiston bo'ylab toza ichimlik suvini tez va qulay yetkazib beramiz." />
    <meta property="og:url" content="https://aquawater-backend.vercel.app/" />
    <meta property="og:image" content="https://aquawater-backend.vercel.app/og.png" />
    <meta property="og:locale" content="uz_UZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="keywords" content="suv yetkazib berish, ichimlik suvi, Toshkent, Uzbekistan" />

    <!--
      Unbounded carries the headings; Manrope carries everything else. Both
      ship Cyrillic and Latin Extended, which the uz / ru / en switcher needs
      (o‘, g‘ and the Russian copy would otherwise fall back mid-sentence).
      Preconnect first so the fonts are not blocked behind the CSS request.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>AquaWater Uzbekistan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
